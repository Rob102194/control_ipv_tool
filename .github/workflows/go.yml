name: Go

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      # cmd/desktop (Wails) necesita WebKit/GTK en Linux. En Windows va con
      # WebView2, ya presente en los runners.
      - name: Dependencias de Wails (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          # Ubuntu 24.04 solo trae webkit2gtk-4.1; Wails la selecciona con esta etiqueta.
          echo "GOFLAGS=-tags=webkit2_41" >> "$GITHUB_ENV"

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build (server + desktop)
        run: go build ./...
